name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: artemis-rdp-runner
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Close previous RDP session announcements
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $headers = @{
          "Authorization" = "Bearer $env:GH_TOKEN"
          "Accept"        = "application/vnd.github+json"
          "User-Agent"    = "RDP-Runner"
        }
        $labels = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/labels?per_page=100" -Headers $headers
        if (-not ($labels | Where-Object { $_.name -eq "rdp-active" })) {
          $labelJson = @{ name = "rdp-active"; color = "00E676"; description = "Active Artemis RDP session" } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/labels" -Headers $headers -Method Post -Body $labelJson -ContentType "application/json" | Out-Null
        }
        $oldIssues = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues?state=open&labels=rdp-active&per_page=100" -Headers $headers
        foreach ($old in $oldIssues) {
          $closeJson = @{ state = "closed" } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues/$($old.number)" -Headers $headers -Method Patch -Body $closeJson -ContentType "application/json" | Out-Null
        }

    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" -Value 0 -Force

        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "UserAuthentication" -Value 0 -Force

        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "SecurityLayer" -Value 0 -Force

        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "fPromptForPassword" -Value 0 -Force

        netsh advfirewall firewall delete rule name="RDP-Tailscale"
        netsh advfirewall firewall add rule name="RDP-Tailscale" `
          dir=in action=allow protocol=TCP localport=3389

        Restart-Service -Name TermService -Force

    - name: Create RDP User with Clean Password
      run: |
        $randDigits = Get-Random -Minimum 100000 -Maximum 999999
        $password = "ArtemisPass${randDigits}!"
        $secure   = ConvertTo-SecureString $password -AsPlainText -Force

        New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

        if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
          Write-Error "User creation failed"
          exit 1
        }

        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "AutoAdminLogon" -Value "1" -Force
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "DefaultUserName" -Value "RDP" -Force
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "DefaultPassword" -Value $password -Force

        echo "RDP_PASS=$password" >> $env:GITHUB_ENV
        echo "RDP_CREDS=RDP / $password" >> $env:GITHUB_ENV

    - name: Install Tailscale
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
        $msi = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest -Uri $url -OutFile $msi
        Start-Process msiexec.exe `
          -ArgumentList "/i `"$msi`" /quiet /norestart" `
          -Wait

        Remove-Item $msi -Force

    - name: Establish Tailscale Connection
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        $key = $env:TAILSCALE_AUTH_KEY
        if (-not $key) { throw "Configure the TAILSCALE_AUTH_KEY repository secret before starting the runner." }
        & "C:\Program Files\Tailscale\tailscale.exe" up `
          --authkey=$key `
          --hostname=github-rdp `
          --unattended

    - name: Wait for Tailscale IP
      run: |
        $tries = 0
        do {
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Start-Sleep 5
          $tries++
        } until ($ip -or $tries -ge 10)

        echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

    - name: Verify RDP Accessibility
      run: |
        Write-Host "Tailscale IP: $env:TAILSCALE_IP"

        $test = Test-NetConnection $env:TAILSCALE_IP -Port 3389
        if (-not $test.TcpTestSucceeded) {
          Write-Error "TCP connection to RDP port 3389 failed"
          exit 1
        }

        Write-Host "TCP connectivity successful!"

    - name: Start Web RDP Gateway
      continue-on-error: true
      run: |
        try {
          netsh advfirewall firewall add rule name="WebRDP-Port" dir=in action=allow protocol=TCP localport=4200
          git clone --depth 1 https://github.com/Mikej81/WebRDP.git C:\WebRDP
          cd C:\WebRDP
          npm install --omit=dev --no-audit --no-fund
          $env:LISTEN_IP = "0.0.0.0"
          $env:LISTEN_PORT = "4200"
          Start-Process -FilePath "node" -ArgumentList "app.js" -WorkingDirectory "C:\WebRDP" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Write-Host "Web RDP Gateway started on port 4200"
        } catch {
          Write-Warning "Web RDP Gateway skipped: $_"
        }

    - name: Maintain Connection
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        Write-Host "========== RDP ACCESS =========="
        Write-Host "Address : $env:TAILSCALE_IP"
        Write-Host "Username: RDP"
        Write-Host "Password: $env:RDP_CREDS"
        Write-Host "Web URL : http://$($env:TAILSCALE_IP):4200/rdp/host/127.0.0.1"
        Write-Host "================================"

        $headers = @{
          "Authorization" = "Bearer $env:GH_TOKEN"
          "Accept"        = "application/vnd.github.v3+json"
          "User-Agent"    = "RDP-Runner"
        }
        $body = "Host: $env:TAILSCALE_IP`nPort: 3389`nUsername: RDP`nPassword: $env:RDP_PASS`nWebUrl: http://$($env:TAILSCALE_IP):4200/rdp/host/127.0.0.1`nStartedAt: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"
        $newJson = @{
          title  = "RDP_SESSION_ACTIVE"
          body   = $body
          labels = @("rdp-active")
        } | ConvertTo-Json
        Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues" -Headers $headers -Method Post -Body $newJson -ContentType "application/json" | Out-Null

        while ($true) {
          Write-Host "[$(Get-Date)] RDP Active - Ctrl+C to stop"
          Start-Sleep 300
        }

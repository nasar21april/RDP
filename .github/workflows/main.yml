name: RDP

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        Restart-Service -Name TermService -Force

    - name: Create RDP User with Secure Password
      run: |
        Add-Type -AssemblyName System.Security
        $charSet = @{
          Upper   = [char[]](65..90)
          Lower   = [char[]](97..122)
          Number  = [char[]](48..57)
          Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
        }
        $raw = @()
        $raw += $charSet.Upper   | Get-Random -Count 4
        $raw += $charSet.Lower   | Get-Random -Count 4
        $raw += $charSet.Number  | Get-Random -Count 4
        $raw += $charSet.Special | Get-Random -Count 4
        $password = ($raw | Get-Random -Count $raw.Count) -join ''
        $secure   = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV

    - name: Setup Direct Cloud Tunnel Tool
      run: |
        Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip"
        Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:ProgramData\bore" -Force
        echo "BORE_EXE=$env:ProgramData\bore\bore.exe" >> $env:GITHUB_ENV

    - name: Launch Persistent Tunnel & Publish Session
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $borePath = "$env:ProgramData\bore\bore.exe"
        $outFile = "$env:TEMP\bore_out.log"
        $errFile = "$env:TEMP\bore_err.log"

        # Start bore.exe in background within this persistent step
        $proc = Start-Process -FilePath $borePath -ArgumentList "local 3389 --to bore.pub" `
          -RedirectStandardOutput $outFile `
          -RedirectStandardError $errFile `
          -PassThru

        # Wait for public listening port to appear
        $hostName = ""
        $port = ""
        for ($i = 0; $i -lt 20; $i++) {
          Start-Sleep 1
          $log = ""
          if (Test-Path $outFile) { $log += Get-Content $outFile -Raw }
          if (Test-Path $errFile) { $log += Get-Content $errFile -Raw }
          if ($log -match "listening at ([a-zA-Z0-9\.\-]+):(\d+)") {
            $hostName = $matches[1]
            $port = $matches[2]
            break
          }
        }

        if (-not $hostName -or -not $port) {
          Write-Host "Bore Log: $log"
          Write-Error "Failed to obtain public tunnel endpoint"
          exit 1
        }

        Write-Host "================== RDP READY =================="
        Write-Host "Host     : $hostName"
        Write-Host "Port     : $port"
        Write-Host "Username : RDP"
        Write-Host "Password : $env:RDP_PASS"
        Write-Host "==============================================="

        # Publish credentials to GitHub Issues for the Android app
        $body = "Host: $hostName`nPort: $port`nUsername: RDP`nPassword: $env:RDP_PASS`nStartedAt: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"
        $headers = @{
          "Authorization" = "Bearer $env:GH_TOKEN"
          "Accept"        = "application/vnd.github.v3+json"
          "User-Agent"    = "RDP-Runner"
        }

        try {
          $openIssues = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues?state=open&labels=rdp-active" -Headers $headers
          foreach ($old in $openIssues) {
            $closeJson = @{ state = "closed" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues/$($old.number)" -Headers $headers -Method Patch -Body $closeJson | Out-Null
          }
        } catch {}

        try {
          $newJson = @{
            title  = "RDP_SESSION_ACTIVE"
            body   = $body
            labels = @("rdp-active")
          } | ConvertTo-Json
          $created = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues" -Headers $headers -Method Post -Body $newJson
          Write-Host "Session details successfully published: Issue #$($created.number)"
        } catch {
          Write-Host "Notice: Session issue creation: $_"
        }

        # Keep bore process running continuously for up to 5 hours (18000s)
        # If bore exits or reconnects, monitor it
        $startTime = Get-Date
        while ((Get-Date) -lt $startTime.AddHours(5)) {
          if ($proc.HasExited) {
            Write-Host "Tunnel process exited with code $($proc.ExitCode). Restarting..."
            $proc = Start-Process -FilePath $borePath -ArgumentList "local 3389 --to bore.pub" `
              -RedirectStandardOutput $outFile `
              -RedirectStandardError $errFile `
              -PassThru
          }
          Write-Host "[$(Get-Date)] Direct RDP Active on ${hostName}:${port}"
          Start-Sleep 60
        }
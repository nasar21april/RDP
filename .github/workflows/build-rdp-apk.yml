name: Build RDP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-rdp-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build RDP APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: .

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/RDP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDP
          path: release_assets/RDP.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2"
          name: "RDP v1.2 — Tailscale Active Reminder & Duplicate Session Guard"
          body: |
            ### 🚀 RDP v1.2 Release
            
            **Direct Android APK Download:**
            Download `RDP.apk` below directly to your phone and install.
            
            **What's New in v1.2:**
            - **Tailscale Active Check & Reminder**: A popup reminder before connecting ensuring Tailscale is turned ON with a direct 1-tap "Open Tailscale" shortcut to avoid Error 0x204.
            - **Duplicate Workflow Guard**: Prevents launching a 2nd runner if a cloud session is already active or in progress.
            - **Auto Password Fill**: Pre-copies and types password for the Windows App / RD Client.
          files: release_assets/RDP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build RDP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-rdp-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build RDP APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: .

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/RDP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDP
          path: release_assets/RDP.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "RDP v1.0"
          body: |
            ### 🚀 RDP v1.0
            
            **Direct Android APK Download:**
            Download `RDP.apk` below directly to your phone and install.
            
            **Features:**
            - One-click Windows Cloud PC launcher powered by GitHub Actions & Tailscale.
            - Fast Jetpack Compose UI with interactive trackpad, special keys bar, and touch navigation.
            - Real-time cloud runner progress & timer tracking.
          files: release_assets/RDP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

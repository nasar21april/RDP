name: RDP

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        Restart-Service -Name TermService -Force

    - name: Create RDP User with Secure Password
      run: |
        Add-Type -AssemblyName System.Security
        $charSet = @{
          Upper   = [char[]](65..90)
          Lower   = [char[]](97..122)
          Number  = [char[]](48..57)
          Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
        }
        $raw = @()
        $raw += $charSet.Upper   | Get-Random -Count 4
        $raw += $charSet.Lower   | Get-Random -Count 4
        $raw += $charSet.Number  | Get-Random -Count 4
        $raw += $charSet.Special | Get-Random -Count 4
        $password = ($raw | Get-Random -Count $raw.Count) -join ''
        $secure   = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV

    - name: Setup Tools
      run: |
        Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip"
        Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:ProgramData\bore" -Force
        echo "BORE_EXE=$env:ProgramData\bore\bore.exe" >> $env:GITHUB_ENV

        git clone https://github.com/Mikej81/WebRDP.git "$env:ProgramData\WebRDP"
        cd "$env:ProgramData\WebRDP"
        npm install --silent
        node esbuild.config.js

        $authFile = "$env:ProgramData\WebRDP\lib\auth.js"
        $content = Get-Content $authFile -Raw
        $target = "export function basicAuth(req, res, next) {"
        $replacement = "export function basicAuth(req, res, next) { if (req.query.user) { req.session.username = req.query.user; req.session.userpassword = req.query.pass || ''; req.session.rdpdomain = ''; return next(); }"
        $content = $content.Replace($target, $replacement)
        Set-Content $authFile $content

    - name: Launch WebRDP, Persistent Tunnel & Publish Session
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        $borePath = "$env:ProgramData\bore\bore.exe"
        $webrdpDir = "$env:ProgramData\WebRDP"

        $env:LISTEN_IP = "0.0.0.0"
        $env:LISTEN_PORT = "4200"
        $procNode = Start-Process -FilePath "node" -ArgumentList "app.js" `
          -WorkingDirectory $webrdpDir `
          -RedirectStandardOutput "$env:TEMP\webrdp_out.log" `
          -RedirectStandardError "$env:TEMP\webrdp_err.log" `
          -PassThru

        $outWeb = "$env:TEMP\bore_web_out.log"
        $errWeb = "$env:TEMP\bore_web_err.log"
        $procWeb = Start-Process -FilePath $borePath -ArgumentList "local 4200 --to bore.pub" `
          -RedirectStandardOutput $outWeb `
          -RedirectStandardError $errWeb `
          -PassThru

        $outRdp = "$env:TEMP\bore_rdp_out.log"
        $errRdp = "$env:TEMP\bore_rdp_err.log"
        $procRdp = Start-Process -FilePath $borePath -ArgumentList "local 3389 --to bore.pub" `
          -RedirectStandardOutput $outRdp `
          -RedirectStandardError $errRdp `
          -PassThru

        $webHost = ""
        $webPort = ""
        $rdpHost = ""
        $rdpPort = ""

        for ($i = 0; $i -lt 30; $i++) {
          Start-Sleep 1
          if (-not $webPort) {
            $lWeb = ""
            if (Test-Path $outWeb) { $lWeb += Get-Content $outWeb -Raw }
            if (Test-Path $errWeb) { $lWeb += Get-Content $errWeb -Raw }
            if ($lWeb -match "listening at ([a-zA-Z0-9\.\-]+):(\d+)") {
              $webHost = $matches[1]
              $webPort = $matches[2]
            }
          }
          if (-not $rdpPort) {
            $lRdp = ""
            if (Test-Path $outRdp) { $lRdp += Get-Content $outRdp -Raw }
            if (Test-Path $errRdp) { $lRdp += Get-Content $errRdp -Raw }
            if ($lRdp -match "listening at ([a-zA-Z0-9\.\-]+):(\d+)") {
              $rdpHost = $matches[1]
              $rdpPort = $matches[2]
            }
          }
          if ($webPort -and $rdpPort) { break }
        }

        if (-not $webPort -or -not $rdpPort) {
          Write-Error "Failed to obtain tunnel endpoints"
          exit 1
        }

        $webUrl = "http://${webHost}:${webPort}/rdp/host/127.0.0.1?user=RDP&pass=$($env:RDP_PASS)"

        Write-Host "================== RDP READY =================="
        Write-Host "Web URL  : $webUrl"
        Write-Host "Host     : $rdpHost"
        Write-Host "Port     : $rdpPort"
        Write-Host "Username : RDP"
        Write-Host "Password : $env:RDP_PASS"
        Write-Host "==============================================="

        $body = "Host: $rdpHost`nPort: $rdpPort`nUsername: RDP`nPassword: $env:RDP_PASS`nWebUrl: $webUrl`nStartedAt: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"
        $headers = @{
          "Authorization" = "Bearer $env:GH_TOKEN"
          "Accept"        = "application/vnd.github.v3+json"
          "User-Agent"    = "RDP-Runner"
        }

        try {
          $openIssues = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues?state=open&labels=rdp-active" -Headers $headers
          foreach ($old in $openIssues) {
            $closeJson = @{ state = "closed" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues/$($old.number)" -Headers $headers -Method Patch -Body $closeJson | Out-Null
          }
        } catch {}

        try {
          $newJson = @{
            title  = "RDP_SESSION_ACTIVE"
            body   = $body
            labels = @("rdp-active")
          } | ConvertTo-Json
          $created = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/issues" -Headers $headers -Method Post -Body $newJson
          Write-Host "Session details successfully published: Issue #$($created.number)"
        } catch {
          Write-Host "Notice: Session issue creation: $_"
        }

        $startTime = Get-Date
        while ((Get-Date) -lt $startTime.AddHours(5)) {
          if ($procNode.HasExited) {
            $procNode = Start-Process -FilePath "node" -ArgumentList "app.js" `
              -WorkingDirectory $webrdpDir `
              -RedirectStandardOutput "$env:TEMP\webrdp_out.log" `
              -RedirectStandardError "$env:TEMP\webrdp_err.log" `
              -PassThru
          }
          if ($procWeb.HasExited) {
            $procWeb = Start-Process -FilePath $borePath -ArgumentList "local 4200 --to bore.pub" `
              -RedirectStandardOutput $outWeb `
              -RedirectStandardError $errWeb `
              -PassThru
          }
          if ($procRdp.HasExited) {
            $procRdp = Start-Process -FilePath $borePath -ArgumentList "local 3389 --to bore.pub" `
              -RedirectStandardOutput $outRdp `
              -RedirectStandardError $errRdp `
              -PassThru
          }
          Write-Host "[$(Get-Date)] Direct RDP & Web GUI Active on ${rdpHost}:${rdpPort}"
          Start-Sleep 60
        }

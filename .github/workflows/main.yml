name: RDP

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        Restart-Service -Name TermService -Force

    - name: Create RDP User with Secure Password
      run: |
        Add-Type -AssemblyName System.Security
        $charSet = @{
          Upper   = [char[]](65..90)
          Lower   = [char[]](97..122)
          Number  = [char[]](48..57)
          Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
        }
        $raw = @()
        $raw += $charSet.Upper   | Get-Random -Count 4
        $raw += $charSet.Lower   | Get-Random -Count 4
        $raw += $charSet.Number  | Get-Random -Count 4
        $raw += $charSet.Special | Get-Random -Count 4
        $password = ($raw | Get-Random -Count $raw.Count) -join ''
        $secure   = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
        echo "RDP_PASS=$password" >> $env:GITHUB_ENV

    - name: Start Direct Cloud Tunnel
      run: |
        Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip"
        Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore" -Force
        $borePath = "$env:TEMP\bore\bore.exe"

        $proc = Start-Process -FilePath $borePath -ArgumentList "local 3389 --to bore.pub" `
          -RedirectStandardOutput "$env:TEMP\bore.log" `
          -RedirectStandardError "$env:TEMP\bore_err.log" `
          -PassThru -NoNewWindow

        $matched = $false
        for ($i = 0; $i -lt 15; $i++) {
          Start-Sleep 1
          $log = ""
          if (Test-Path "$env:TEMP\bore.log") { $log += Get-Content "$env:TEMP\bore.log" -Raw }
          if (Test-Path "$env:TEMP\bore_err.log") { $log += Get-Content "$env:TEMP\bore_err.log" -Raw }
          if ($log -match "listening at ([a-zA-Z0-9\.\-]+):(\d+)") {
            $hostName = $matches[1]
            $port = $matches[2]
            echo "TUNNEL_HOST=$hostName" >> $env:GITHUB_ENV
            echo "TUNNEL_PORT=$port" >> $env:GITHUB_ENV
            Write-Host "Direct Public Address: ${hostName}:${port}"
            $matched = $true
            break
          }
        }
        if (-not $matched) {
          Write-Host "Tunnel Log: $log"
          Write-Error "Could not start direct tunnel"
          exit 1
        }

    - name: Publish Session Details to App
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $body = "Host: $env:TUNNEL_HOST`nPort: $env:TUNNEL_PORT`nUsername: RDP`nPassword: $env:RDP_PASS`nStartedAt: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')"

        try {
          $existing = gh issue list --label "rdp-active" --state open --json number | ConvertFrom-Json
          foreach ($iss in $existing) {
            gh issue close $iss.number
          }
        } catch {}

        $newIssue = gh issue create --title "RDP_SESSION_ACTIVE" --body "$body" --label "rdp-active"
        Write-Host "Created Session Issue: $newIssue"

    - name: Maintain Connection
      run: |
        Write-Host "================== RDP READY =================="
        Write-Host "Host     : $env:TUNNEL_HOST"
        Write-Host "Port     : $env:TUNNEL_PORT"
        Write-Host "Username : RDP"
        Write-Host "Password : $env:RDP_PASS"
        Write-Host "==============================================="
        while ($true) {
          Write-Host "[$(Get-Date)] Direct RDP Active"
          Start-Sleep 300
        }